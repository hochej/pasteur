name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: "1.2.13"

      # Optional secrets (enable Developer ID signing + notarization):
      # - MACOS_CERTIFICATE_P12_BASE64: base64 of a Developer ID Application .p12
      # - MACOS_CERTIFICATE_PASSWORD: password for the .p12
      # - MACOS_SIGN_IDENTITY: e.g. "Developer ID Application: Your Name (TEAMID)"
      # - APPLE_ID: Apple ID email used for notarization
      # - APPLE_TEAM_ID: Team ID
      # - APPLE_APP_SPECIFIC_PASSWORD: app-specific password for the Apple ID
      - name: Determine release mode
        id: mode
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          can_sign=false
          if [[ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" && -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            can_sign=true
          fi

          can_notarize=false
          if [[ "$can_sign" == "true" && -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
            can_notarize=true
          fi

          echo "can_sign=$can_sign" >> "$GITHUB_OUTPUT"
          echo "can_notarize=$can_notarize" >> "$GITHUB_OUTPUT"

          if [[ "$can_notarize" == "true" ]]; then
            echo "Will produce a Developer ID signed + notarized release."
          elif [[ "$can_sign" == "true" ]]; then
            echo "Will produce a Developer ID signed (NOT notarized) release."
          else
            echo "Will produce an ad-hoc signed (NOT notarized) release."
          fi

      - name: Import Developer ID certificate
        if: steps.mode.outputs.can_sign == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="actions"
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning

      - name: Configure notarization credentials
        if: steps.mode.outputs.can_notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          xcrun notarytool store-credentials "pasteur-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build release artifact
        env:
          REQUIRE_SIGNING: ${{ steps.mode.outputs.can_sign == 'true' && '1' || '0' }}
          REQUIRE_NOTARIZATION: ${{ steps.mode.outputs.can_notarize == 'true' && '1' || '0' }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ steps.mode.outputs.can_notarize == 'true' && 'pasteur-notary' || '' }}
        run: ./scripts/release.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: build/release/Pasteur.app.zip
